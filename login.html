<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CloudTranslate</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        :root {
            --cream: #faf7ef;
            --cream-dark: #f1eadb;
            --sage: #dce8df;
            --sage-light: #edf4ee;
            --teal: #2f6f68;
            --dark-teal: #174f4a;
            --text: #18322f;
            --muted: #647874;
            --white: #ffffff;
            --border: #dce5df;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--cream);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        .navbar {
            width: 100%;
            height: 72px;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8%;
        }

        .logo {
            font-size: 21px;
            font-weight: 700;
            color: var(--dark-teal);
        }

        .nav-links a {
            text-decoration: none;
            color: var(--teal);
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: var(--sage-light);
            color: var(--dark-teal);
        }

        /* MAIN */

        .login-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 55px 20px;

            background:
                radial-gradient(
                    circle at top left,
                    var(--sage-light),
                    transparent 35%
                ),
                var(--cream);
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            background: var(--white);
            padding: 42px 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 18px 45px rgba(23, 79, 74, 0.10);
            text-align: center;
        }

        .login-icon {
            width: 68px;
            height: 68px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: var(--sage);
            border-radius: 18px;
            font-size: 32px;
        }

        .login-card h1 {
            color: var(--dark-teal);
            font-size: 30px;
            margin-bottom: 9px;
        }

        .login-subtitle {
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* FORM */

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--dark-teal);
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;

            border: 1px solid var(--border);
            border-radius: 10px;

            background: #fcfdfc;
            color: var(--text);

            font-size: 15px;
            outline: none;

            transition: 0.3s;
        }

        .form-group input:focus {
            border-color: var(--teal);

            box-shadow:
                0 0 0 3px
                rgba(47, 111, 104, 0.10);
        }

        .form-group input::placeholder {
            color: #91a19d;
        }

        /* LOGIN BUTTON */

        .login-button {
            width: 100%;

            border: none;
            border-radius: 10px;

            padding: 15px;
            margin-top: 5px;

            background: var(--dark-teal);
            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;
            transition: 0.3s;
        }

        .login-button:hover {
            background: var(--teal);

            transform: translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(23, 79, 74, 0.18);
        }

        /* NOTE */

        .login-note {
            margin-top: 24px;

            padding: 13px 15px;

            background: var(--sage-light);

            border: 1px solid var(--border);
            border-radius: 10px;

            color: var(--muted);

            font-size: 12px;
            line-height: 1.6;
        }

        /* FOOTER */

        footer {
            background: var(--dark-teal);
            color: white;

            text-align: center;

            padding: 28px 20px;
        }

        footer .logo {
            color: white;
            margin-bottom: 8px;
        }

        footer p {
            margin: 5px 0;

            font-size: 13px;
            color: #dce8df;
        }

        footer .copyright {
            margin-top: 10px;
            color: #b8ccc7;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .navbar {
                padding: 0 5%;
            }

            .logo {
                font-size: 18px;
            }

            .login-container {
                padding: 35px 16px;
            }

            .login-card {
                padding: 34px 24px;
            }

            .login-card h1 {
                font-size: 26px;
            }
        }
    </style>

</head>

<body class="login-page">

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            ☁️ CloudTranslate
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

        </div>

    </nav>


    <!-- LOGIN -->

    <main class="login-container">

        <div class="login-card">

            <div class="login-icon">
                ☁️
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="login-subtitle">
                Login to continue to CloudTranslate
            </p>


            <form
                id="loginForm"
                onsubmit="loginUser(event)"
            >

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login →
                </button>

            </form>


            <p class="login-note">
                🔐 Secure authentication will be connected
                with Amazon Cognito.
            </p>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="logo">
            ☁️ CloudTranslate
        </div>

        <p>
            Cloud-Based Language Translation System
        </p>

        <p class="copyright">
            © 2026 CloudTranslate
        </p>

    </footer>


    <script src="js/login.js"></script>

</body>

</html>
